name: Orbis

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      title:
        description: Problem to look into. Leave empty for a check-up.
        required: false
      details:
        description: What happened
        required: false
  workflow_run:
    workflows: [CI]
    types: [completed]
  deployment_status:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  orbis:
    uses: HaziqHaiqal/Agents/.github/workflows/orbis.yml@orbis-v1
    with:
      site: https://www.splitin.me
      setup: pnpm install --frozen-lockfile && pnpm exec next typegen
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
